name: Run Demo
on: [push, pull_request]


jobs:
  tests:
    name: Run Demo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: ["getting_started", "understanding_21cmsense", "reproducing_pober_2015"]
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Deps
        run: |
          uv pip install --system .
          uv pip install --system papermill ipykernel
          uv pip list --system

      - name: Install ska-ost-array-config
        run: |
          uv pip install --system \
            --extra-index-url https://artefact.skao.int/repository/pypi-internal/simple/ \
            "ska-ost-array-config>=5"

      - name: Install ipykernel
        run: python -m ipykernel install --user --name sense --display-name "sense"

      - name: Run Notebook
        run: |
          papermill -k sense docs/tutorials/${{ matrix.demo }}.ipynb output-${{ matrix.demo }}.ipynb

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.demo }}
          path: output-${{ matrix.demo }}.ipynb
